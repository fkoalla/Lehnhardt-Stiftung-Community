title: "PORA Community"
tagline: "Der Austausch-Blog der Lehnhardt-Stiftung"
description: >-
  Der Community-Blog für Teilnehmende der PORA-Seminare der Lehnhardt-Stiftung:
  Erfahrungsberichte, Austausch und gegenseitige Unterstützung rund um Hörverlust,
  Cochlea-Implantat-Rehabilitation und Inklusion.
url: "https://fkoalla.github.io"
baseurl: "/lehnhardt-stiftung-community"
lang: de-DE

foundation_url: "https://lehnhardt-stiftung.org/"
pora_url: "https://lehnhardt-stiftung.org/en/category/pora-en/"
donate_url: "https://lehnhardt-stiftung.org/en/spenden/"

# GitHub Discussions-basierter Kommentarbereich (giscus).
# Werte bitte nach Aktivierung von "Discussions" im Repo unter https://giscus.app konfigurieren
# und hier eintragen (siehe README.md, Abschnitt "Community-Austausch aktivieren").
giscus:
  repo: "fkoalla/lehnhardt-stiftung-community"
  repo_id: ""
  category: "Austausch"
  category_id: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
